<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
    <style>
        .con{
            height: 650px;
         /* border: 1px solid black;  */
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .box{
            height: 80%;
            width: 75%;
            /* border: 1px solid black; */
            display: flex;
            box-shadow: 10px 10px 10px;
            border-radius: 20px;
        }
        .left,.center,.right{
            height: 100%;
            /* border: 1px solid black; */
        }
        .left{
            width: 3%;
            background-color: navy;
            border-radius: 20px; 
        }
        .center{
            width: 63%;
            font-size: 60px;
            color: navy;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: whitesmoke;
        }
        *{
            padding: 0;
            margin: 0;
        }
        .right{
            width: 35%;
            /* border-left: 1px solid grey */
        }
        .top{
            height: 30%;
            /* border: 1px solid black; */
        }
            .bottom{
                height: 70%;
                /* border: 1px solid black; */
                margin-top: 30px;;
            }
            .top-in{
                height: 90%;
                /* border: 1px solid black; */
                background-color: navy;
                border-top-left-radius: 20px;
                border-top-right-radius: 20px;
            }
            .circle{
                position: absolute;
                top: 92px;
                right: 326px;
                height: 120px;
                width: 120px;
                border: 5px solid navy;
                border-radius: 50%;
                display: flex;
                align-items: center;
                justify-content: center;
            }
            img{
                height: 100%;
                width: 100%;
                border-radius: 50%;
                border: 2px solid white;
            }
            .button{
                height: 20%;
                display: flex;
                align-items: center;
                justify-content: space-evenly;
            }
            .button1{
                border-radius: 20px;
                text-align: center;
                color: white;
                line-height: 30px;
                height: 50%;
                width: 40%;
                background-color: navy;
            }
            .icon{
                height: 20%;
                display: flex;
                align-items: center;
                justify-content: space-evenly;
            }
            .fa-facebook{
                color: blue;
            }
            .fa-github{
                color: violet;
            }
            .fa-linkedin{
                color: rgb(71, 134, 186);
            }
            .fa-instagram{
                 background:linear-gradient(red,orange);
                color: transparent;
                background-clip: text;
            }
            .fa-heart{
                color: red;
            }
            .fa-comment{
                color: rgb(39, 87, 141);
            }
            h1{
              margin-left: 20px;
              margin-right: 30px;
            }
    </style>
</head>
<body>
    <div class="con">
        <div class="box">
            <div class="left"></div>
            <div class="center">
                <h1>Profile Card UI/UX Design  </h1>
            </div>
            <div class="right">
                <div class="top">
                    <div class="top-in">
                        <div class="circle">
                            <img src="logo.png.jpg" alt="">
                        </div>
                    </div>
                </div>
                <div class="bottom">
                    <h2 align="center">Website Developer</h2>
                    <h2 align="center">Dezyne École College</h2>
                    <h2 align="center">BCA First Year</h2>
                    <div class="icon">
                        <i class="fa fa-brands fa-facebook fa-2x"></i>
                        <i class="fa fa-brands fa-instagram fa-2x"></i>
                        <i class="fa fa-brands fa-github fa-2x"></i>
                        <i class="fa fa-brands fa-linkedin fa-2x"></i>
                         <i class="fa fa-brands fa-behance fa-2x"></i>
                    </div>
                    <div class="button">
                    <div class="button1">Subscribe</div>
                    <div class="button1">Messege</div>
                    </div>
                    <div class="icon">
                        <i class="fa fa-solid fa-heart"></i>60k
                        <i class="fa fa-solid fa-comment"></i>12.6k
                        <i class="fa fa-solid fa-share fa-flip-horizontal"></i>20k
                    </div>
            </div>
            </div>
        </div>
    </div>
</body>
</html>
